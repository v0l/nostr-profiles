[package]
name = "nostr-classify"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
async-openai = { version = "0.36.1", features = ["_api", "chat-completion"] }
async-trait = "0.1.89"
axum = "0.8"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
config = "0.15.22"
ffmpeg-rs-raw = "1.0"
futures = "0.3.32"
hex = "0.4"
hyper = "1"
hyper-util = "0.1"
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }
nostr-database = "0.44.0"
nostr-relay-builder = "0.44.0"
nostr-sdk = "0.44.1"
regex = "1.12.3"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "__rustls-aws-lc-rs"] }
ring = "0.17"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
