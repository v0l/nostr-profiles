llm:
  api_base_url: "http://localhost:8001/v1"
  model: "qwen3.5:122b"
  api_key: ""

nostr:
  nsec: ""  # optional: nsec1... or hex secret key for signing
  relays:
    - "wss://relay.damus.io"
    - "wss://nostr.bitcoiner.social"
    - "wss://nos.lol"
    - "wss://relay.primal.net"
    - "wss://nostr.wine"
    - "wss://nostr.land"
    - "wss://nostr.mom"
    - "wss://nostr.oxtr.dev"

processing:
  event_threshold: 20
  cache_days: 7
  max_workers: 4
  max_retries: 3
  image_download_timeout_secs: 30
  min_followers: 3

database:
  path: "nostr_classify.db"

image_cache:
  dir: "/tmp/nostr-classify-images"
  cleanup_days: 1

logging:
  level: "info"
