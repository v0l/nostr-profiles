llm:
  api_base_url: "http://localhost:8001/v1"
  model: "qwen3.5:122b"
  api_key: ""
  timeout_secs: 120 # per-request HTTP timeout
  classify_timeout_secs: 300 # overall timeout for a single classification (all LLM + tool calls)

nostr:
  nsec: "" # optional: nsec1... or hex secret key for signing
  relays:
    - "wss://relay.damus.io"
    - "wss://nostr.bitcoiner.social"
    - "wss://nos.lol"
    - "wss://relay.primal.net"
    - "wss://nostr.wine"
    - "wss://nostr.land"
    - "wss://nostr.mom"
    - "wss://nostr.oxtr.dev"

processing:
  event_threshold: 20
  classification_event_limit: 50
  cache_days: 7
  # Cap on newest events retained per pubkey. A periodic sweep trims the excess,
  # bounding the events table while keeping all events for infrequent posters so
  # they can still accumulate enough to be classified. Keep >= classification_event_limit.
  max_events_per_pubkey: 64
  # How often (seconds) to run the per-pubkey retention sweep.
  event_retention_interval_secs: 3600
  max_workers: 4
  max_retries: 3
  image_download_timeout_secs: 30
  min_followers: 3
  job_timeout_secs: 600 # overall timeout for a single classification job (fetch + classify + save)
  tool_call_timeout_secs: 30 # timeout for individual LLM tool calls (get_event, get_profile, etc.)
  # ASR (speech-to-text) for transcribing audio from video files. Optional.
  # Connects to a Wyoming protocol server (e.g. wyoming-faster-whisper).
  asr:
    uri: "tcp://127.0.0.1:10300"
  #  language: "en"  # optional, server may auto-detect

database:
  path: "nostr_classify.db"

image_cache:
  dir: "/tmp/nostr-classify-images"
  cleanup_days: 1

logging:
  level: "info"

chat_logs:
  dir: "chat_logs" # directory to store per-pubkey LLM chat logs as JSON files

labels:
  taxonomy_file: null # path to a text file with one label per line, or null for built-in set
  min_score: 0.4 # minimum score (0.0-1.0) for a label to be included
