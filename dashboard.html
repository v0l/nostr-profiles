<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostr Profile Classifier</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .app {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
            color: #fff;
        }
        h2 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 16px;
            margin-top: 32px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }
        .search-box input:focus {
            border-color: #64b5f6;
        }
        .search-box button {
            padding: 12px 24px;
            background: #64b5f6;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .search-box button:hover {
            background: #42a5f5;
        }
        .search-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #ef5350;
            padding: 10px;
            background: #2a1a1a;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .card {
            background: #2a2a2a;
            border-radius: 12px;
            border: 1px solid #3a3a3a;
            padding: 20px;
            margin-bottom: 12px;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #444;
            object-fit: cover;
            flex-shrink: 0;
        }
        .avatar-small {
            width: 32px;
            height: 32px;
        }
        .author-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }
        .author-name {
            font-weight: 600;
            color: #fff;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nip05 {
            font-size: 12px;
            color: #64b5f6;
        }
        .pubkey {
            font-family: monospace;
            font-size: 11px;
            color: #888;
            word-break: break-all;
        }
        .about {
            color: #bbb;
            line-height: 1.5;
            margin-bottom: 14px;
            font-size: 14px;
        }
        .meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #3a3a3a;
        }
        .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .labels {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .label {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #e0e0e0;
            overflow: hidden;
        }
        .label-bg {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            opacity: 0.35;
        }
        .label-text {
            position: relative;
            z-index: 1;
        }
        .label-score {
            position: relative;
            z-index: 1;
            font-size: 10px;
            opacity: 0.6;
        }
        .bio {
            color: #bbb;
            line-height: 1.5;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .confidence {
            font-size: 12px;
            color: #888;
        }
        .confidence-bar {
            height: 4px;
            background: #3a3a3a;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }
        .confidence-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }
        .no-classification {
            color: #666;
            font-style: italic;
            font-size: 14px;
        }
        .recent-item {
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .recent-item:hover {
            border-color: #64b5f6;
        }
        .recent-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .recent-name {
            font-weight: 600;
            color: #fff;
            font-size: 14px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .recent-time {
            font-size: 11px;
            color: #666;
            flex-shrink: 0;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .stat-card {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            padding: 14px 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }
        .stat-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .stat-value.green { color: #66bb6a; }
        .stat-value.blue { color: #64b5f6; }
        .stat-value.orange { color: #ffa726; }
        .label-stats {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }
        .label-stats h3 {
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .label-bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .label-bar-name {
            width: 120px;
            font-size: 12px;
            color: #ccc;
            text-align: right;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .label-bar-track {
            flex: 1;
            height: 18px;
            background: #3a3a3a;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .label-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s;
        }
        .label-bar-count {
            width: 50px;
            font-size: 11px;
            color: #888;
            flex-shrink: 0;
        }
        .labels-toggle {
            font-size: 12px;
            color: #64b5f6;
            cursor: pointer;
            background: none;
            border: none;
            padding: 6px 0;
            text-align: left;
        }
        .labels-toggle:hover {
            color: #42a5f5;
        }
        .kind-breakdown {
            margin-bottom: 16px;
        }
        .kind-bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .kind-bar-name {
            width: 160px;
            font-size: 12px;
            color: #ccc;
            text-align: right;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .kind-bar-track {
            flex: 1;
            height: 16px;
            background: #3a3a3a;
            border-radius: 4px;
            overflow: hidden;
        }
        .kind-bar-fill {
            height: 100%;
            border-radius: 4px;
            background: #81c784;
            transition: width 0.4s;
        }
        .kind-bar-count {
            width: 40px;
            font-size: 11px;
            color: #888;
            flex-shrink: 0;
        }
        .kind-bar-pct {
            width: 40px;
            font-size: 11px;
            color: #666;
            flex-shrink: 0;
            text-align: right;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "preact": "https://esm.sh/preact",
            "preact/": "https://esm.sh/preact/",
            "htm/preact": "https://esm.sh/htm/preact?external=preact"
        }
    }
    </script>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { h, render } from 'preact';
        import { html } from 'htm/preact';
        import { useState, useEffect, useCallback } from 'preact/hooks';

        function timeAgo(dateStr) {
            if (!dateStr) return '';
            const diff = Date.now() - new Date(dateStr).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return mins + 'm ago';
            const hours = Math.floor(mins / 60);
            if (hours < 24) return hours + 'h ago';
            return Math.floor(hours / 24) + 'd ago';
        }

        // Map label score to a color — higher scores are more vibrant
        function scoreColor(score) {
            if (score >= 0.8) return '#66bb6a'; // green
            if (score >= 0.6) return '#64b5f6'; // blue
            if (score >= 0.4) return '#ffa726'; // orange
            return '#ef5350'; // red-ish
        }

        function LabelPill({ label, score }) {
            const color = scoreColor(score);
            return html`
                <span class="label">
                    <span class="label-bg" style=${{ background: color }} />
                    <span class="label-text">${label}</span>
                    <span class="label-score">${(score * 100).toFixed(0)}%</span>
                </span>
            `;
        }

        function KindBreakdown({ breakdown, total }) {
            if (!breakdown || breakdown.length === 0) return null;
            const maxCount = breakdown[0]?.count || 1;
            return html`
                <div class="kind-breakdown">
                    <h3 style=${{ color: '#fff', fontSize: '14px', marginBottom: '10px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Event Kinds</h3>
                    ${breakdown.map(({ kind, name, count }) => html`
                        <div class="kind-bar-row" key=${kind}>
                            <span class="kind-bar-name" title=${`Kind ${kind}`}>${name}</span>
                            <div class="kind-bar-track">
                                <div class="kind-bar-fill" style=${{ width: (count / maxCount * 100) + '%' }} />
                            </div>
                            <span class="kind-bar-count">${count}</span>
                            <span class="kind-bar-pct">${(count / total * 100).toFixed(0)}%</span>
                        </div>
                    `)}
                </div>
            `;
        }

        function ProfileCard({ profile, onSearch }) {
            if (!profile) return null;
            const { name, picture, nip05, pubkey, about, event_count, classification_status, classification } = profile;

            const statusLabel = classification_status === 'current' ? 'Classified'
                : classification_status === 'stale' ? `Stale (epoch ${classification_status.epoch})`
                : 'Not classified';
            const statusColor = classification_status === 'current' ? '#66bb6a'
                : classification_status === 'stale' ? '#ffa726'
                : '#ef5350';
            const hasClassification = classification_status !== 'none';

            return html`
                <div class="card">
                    <div class="card-header">
                        ${picture && html`<img class="avatar" src=${picture} alt="" onerror=${(e) => e.target.style.display = 'none'} />`}
                        <div class="author-info">
                            <span class="author-name">${name || 'Unknown'}</span>
                            ${nip05 && html`<span class="nip05">${nip05}</span>`}
                            <span class="pubkey">${pubkey}</span>
                        </div>
                    </div>
                    ${about && html`<div class="about">${about}</div>`}
                    <div class="meta">
                        <span>${event_count} events</span>
                        <span style=${{ color: statusColor }}>${statusLabel}</span>
                    </div>
                    ${hasClassification && classification && classification.kind_breakdown && classification.kind_breakdown.length > 0 && html`<${KindBreakdown} breakdown=${classification.kind_breakdown} total=${classification.analyzed_event_count} />`}
                    <div>
                        <h3 style=${{ color: '#fff', fontSize: '14px', marginBottom: '10px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Classification</h3>
                        ${hasClassification && classification ? html`
                            <div class="labels">
                                ${Object.entries(classification.scores)
                                    .sort((a, b) => b[1] - a[1])
                                    .filter(([_, s]) => s >= 0.3)
                                    .map(([l, score]) => html`<${LabelPill} key=${l} label=${l} score=${score} />`)
                                }
                            </div>
                            <p class="bio">${classification.bio}</p>
                            <div class="confidence">
                                Confidence: ${(classification.confidence * 100).toFixed(0)}%
                                <div class="confidence-bar">
                                    <div class="confidence-fill" style=${{
                                        width: (classification.confidence * 100) + '%',
                                        background: classification.confidence >= 0.8 ? '#66bb6a' : classification.confidence >= 0.6 ? '#ffa726' : '#ef5350'
                                    }} />
                                </div>
                            </div>
                        ` : html`<p class="no-classification">No classification available yet</p>`}
                    </div>
                </div>
            `;
        }

        function RecentItem({ item, onSearch }) {
            const name = item.name || item.pubkey.slice(0, 12) + '...';
            return html`
                <div class="card recent-item" onclick=${() => onSearch(item.pubkey)}>
                    <div class="recent-header">
                        ${item.picture && html`<img class="avatar avatar-small" src=${item.picture} alt="" onerror=${(e) => e.target.style.display = 'none'} />`}
                        ${!item.picture && html`<div class="avatar avatar-small" />`}
                        <span class="recent-name">${name}</span>
                        <span class="recent-time">${timeAgo(item.analyzed_at)}</span>
                    </div>
                    <div class="labels">
                        ${Object.entries(item.scores)
                            .sort((a, b) => b[1] - a[1])
                            .filter(([_, s]) => s >= 0.3)
                            .slice(0, 5)
                            .map(([l, score]) => html`<${LabelPill} key=${l} label=${l} score=${score} />`)
                        }
                    </div>
                </div>
            `;
        }

        function StatsBar({ stats }) {
            if (!stats) return null;
            return html`
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_profiles.toLocaleString()}</div>
                        <div class="stat-label">Profiles</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value green">${stats.classified_profiles.toLocaleString()}</div>
                        <div class="stat-label">Classified</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value blue">${stats.total_events.toLocaleString()}</div>
                        <div class="stat-label">Events</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value orange">${stats.images_classified.toLocaleString()}</div>
                        <div class="stat-label">Images</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value orange">${stats.queue_size.toLocaleString()}</div>
                        <div class="stat-label">Queue</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value blue">${stats.labels.total_unique_labels.toLocaleString()}</div>
                        <div class="stat-label">Labels</div>
                    </div>
                </div>
            `;
        }

        function LabelStatsPanel({ stats }) {
            const [expanded, setExpanded] = useState(false);
            if (!stats || !stats.labels || stats.labels.label_counts.length === 0) return null;

            const maxCount = stats.labels.label_counts[0]?.count || 1;
            const showCount = expanded ? stats.labels.label_counts.length : 10;
            const visible = stats.labels.label_counts.slice(0, showCount);
            const hasMore = stats.labels.label_counts.length > 10;

            return html`
                <div class="label-stats">
                    <h3>Top Labels</h3>
                    ${visible.map(({ label, count }) => html`
                        <div class="label-bar-row" key=${label}>
                            <span class="label-bar-name">${label}</span>
                            <div class="label-bar-track">
                                <div class="label-bar-fill" style=${{
                                    width: (count / maxCount * 100) + '%',
                                    background: '#64b5f6'
                                }} />
                            </div>
                            <span class="label-bar-count">${count}</span>
                        </div>
                    `)}
                    ${hasMore && html`
                        <button class="labels-toggle" onClick=${() => setExpanded(!expanded)}>
                            ${expanded ? 'Show less' : `Show all ${stats.labels.label_counts.length} labels`}
                        </button>
                    `}
                </div>
            `;
        }

        function App() {
            const [pubkey, setPubkey] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [profile, setProfile] = useState(null);
            const [recent, setRecent] = useState([]);
            const [stats, setStats] = useState(null);

            const searchProfile = useCallback(async (pk) => {
                const key = (pk || pubkey).trim();
                if (!key) return;
                setLoading(true);
                setError(null);
                setProfile(null);
                try {
                    // Check if it looks like a pubkey (hex or npub) vs a search query
                    const isPubkey = /^[0-9a-f]{64}$/i.test(key) || key.startsWith('npub1');
                    if (isPubkey) {
                        const res = await fetch('/api/profile/' + encodeURIComponent(key));
                        if (res.status === 404) { setError('Profile not found'); return; }
                        if (!res.ok) { setError(await res.text() || 'Failed to fetch'); return; }
                        setProfile(await res.json());
                    } else {
                        // Search by label/bio text
                        const res = await fetch('/api/search?q=' + encodeURIComponent(key));
                        if (!res.ok) { setError(await res.text() || 'Search failed'); return; }
                        const results = await res.json();
                        setRecent(results);
                        if (results.length === 0) { setError('No results found'); return; }
                        // Show first result as profile
                        const first = results[0];
                        const profileRes = await fetch('/api/profile/' + encodeURIComponent(first.pubkey));
                        if (profileRes.ok) {
                            setProfile(await profileRes.json());
                        }
                        // Also update recent with search results
                        setRecent(results);
                    }
                    if (pk) setPubkey(pk);
                } catch { setError('Failed to connect to server'); }
                finally { setLoading(false); }
            }, [pubkey]);

            useEffect(() => {
                fetch('/api/recent?limit=20')
                    .then(r => r.json())
                    .then(setRecent)
                    .catch(() => {});
                const loadStats = () => fetch('/api/stats').then(r => r.json()).then(setStats).catch(() => {});
                loadStats();
                const iv = setInterval(loadStats, 10000);
                return () => clearInterval(iv);
            }, []);

            useEffect(() => {
                if (profile) {
                    setRecent(prev => {
                        const idx = prev.findIndex(r => r.pubkey === profile.pubkey);
                        if (idx === -1) return prev;
                        const updated = [...prev];
                        updated[idx] = { ...updated[idx], name: profile.name, picture: profile.picture };
                        return updated;
                    });
                }
            }, [profile]);

            return html`
                <div class="app">
                    <h1>Nostr Profile Classifier</h1>

                    <${StatsBar} stats=${stats} />
                    <${LabelStatsPanel} stats=${stats} />

                    <div class="search-box">
                        <input type="text"
                            value=${pubkey}
                            onInput=${(e) => setPubkey(e.target.value)}
                            onKeyPress=${(e) => e.key === 'Enter' && searchProfile()}
                            placeholder="Enter pubkey (hex/npub) or search labels..."
                            disabled=${loading} />
                        <button onClick=${() => searchProfile()} disabled=${loading}>
                            ${loading ? 'Loading...' : 'Search'}
                        </button>
                    </div>

                    ${error && html`<div class="error">${error}</div>`}
                    ${profile && html`<${ProfileCard} profile=${profile} onSearch=${searchProfile} />`}

                    <h2>Recent Classifications</h2>
                    <div>
                        ${recent.length === 0 && html`<div class="loading">No classifications yet</div>`}
                        ${recent.map(item => html`<${RecentItem} key=${item.pubkey} item=${item} onSearch=${searchProfile} />`)}
                    </div>
                </div>
            `;
        }

        render(html`<${App} />`, document.getElementById('app'));
    </script>
</body>
</html>
