<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostr Profile Classifier</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .app {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
            color: #fff;
        }
        h2 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 16px;
            margin-top: 32px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }
        .search-box input:focus {
            border-color: #64b5f6;
        }
        .search-box button {
            padding: 12px 24px;
            background: #64b5f6;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .search-box button:hover {
            background: #42a5f5;
        }
        .search-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #ef5350;
            padding: 10px;
            background: #2a1a1a;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .card {
            background: #2a2a2a;
            border-radius: 12px;
            border: 1px solid #3a3a3a;
            padding: 20px;
            margin-bottom: 12px;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #444;
            object-fit: cover;
            flex-shrink: 0;
        }
        .avatar-small {
            width: 32px;
            height: 32px;
        }
        .author-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }
        .author-name {
            font-weight: 600;
            color: #fff;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nip05 {
            font-size: 12px;
            color: #64b5f6;
        }
        .pubkey {
            font-family: monospace;
            font-size: 11px;
            color: #888;
            word-break: break-all;
        }
        .about {
            color: #bbb;
            line-height: 1.5;
            margin-bottom: 14px;
            font-size: 14px;
        }
        .meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #3a3a3a;
        }
        .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .labels {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .label {
            background: #3a3a3a;
            color: #64b5f6;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .bio {
            color: #bbb;
            line-height: 1.5;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .confidence {
            font-size: 12px;
            color: #888;
        }
        .confidence-bar {
            height: 4px;
            background: #3a3a3a;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }
        .confidence-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }
        .no-classification {
            color: #666;
            font-style: italic;
            font-size: 14px;
        }
        .recent-item {
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .recent-item:hover {
            border-color: #64b5f6;
        }
        .recent-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .recent-name {
            font-weight: 600;
            color: #fff;
            font-size: 14px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .recent-time {
            font-size: 11px;
            color: #666;
            flex-shrink: 0;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "preact": "https://esm.sh/preact",
            "preact/": "https://esm.sh/preact/",
            "htm/preact": "https://esm.sh/htm/preact?external=preact"
        }
    }
    </script>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { h, render } from 'preact';
        import { html } from 'htm/preact';
        import { useState, useEffect, useCallback } from 'preact/hooks';

        function timeAgo(dateStr) {
            if (!dateStr) return '';
            const diff = Date.now() - new Date(dateStr).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return mins + 'm ago';
            const hours = Math.floor(mins / 60);
            if (hours < 24) return hours + 'h ago';
            return Math.floor(hours / 24) + 'd ago';
        }

        function ProfileCard({ profile, onSearch }) {
            if (!profile) return null;
            const { name, picture, nip05, pubkey, about, event_count, is_classified, classification } = profile;

            return html`
                <div class="card">
                    <div class="card-header">
                        ${picture && html`<img class="avatar" src=${picture} alt="" onerror=${(e) => e.target.style.display = 'none'} />`}
                        <div class="author-info">
                            <span class="author-name">${name || 'Unknown'}</span>
                            ${nip05 && html`<span class="nip05">${nip05}</span>`}
                            <span class="pubkey">${pubkey}</span>
                        </div>
                    </div>
                    ${about && html`<div class="about">${about}</div>`}
                    <div class="meta">
                        <span>${event_count} events</span>
                        <span style=${{ color: is_classified ? '#66bb6a' : '#ef5350' }}>${is_classified ? 'Classified' : 'Not classified'}</span>
                    </div>
                    <div>
                        <h3 style=${{ color: '#fff', fontSize: '14px', marginBottom: '10px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Classification</h3>
                        ${is_classified && classification ? html`
                            <div class="labels">
                                ${classification.labels.map(l => html`<span class="label" key=${l}>${l}</span>`)}
                            </div>
                            <p class="bio">${classification.bio}</p>
                            <div class="confidence">
                                Confidence: ${(classification.confidence * 100).toFixed(0)}%
                                <div class="confidence-bar">
                                    <div class="confidence-fill" style=${{
                                        width: (classification.confidence * 100) + '%',
                                        background: classification.confidence >= 0.8 ? '#66bb6a' : classification.confidence >= 0.6 ? '#ffa726' : '#ef5350'
                                    }} />
                                </div>
                            </div>
                        ` : html`<p class="no-classification">No classification available yet</p>`}
                    </div>
                </div>
            `;
        }

        function RecentItem({ item, onSearch }) {
            const name = item.name || item.pubkey.slice(0, 12) + '...';
            return html`
                <div class="card recent-item" onclick=${() => onSearch(item.pubkey)}>
                    <div class="recent-header">
                        ${item.picture && html`<img class="avatar avatar-small" src=${item.picture} alt="" onerror=${(e) => e.target.style.display = 'none'} />`}
                        ${!item.picture && html`<div class="avatar avatar-small" />`}
                        <span class="recent-name">${name}</span>
                        <span class="recent-time">${timeAgo(item.analyzed_at)}</span>
                    </div>
                    <div class="labels">
                        ${item.labels.slice(0, 5).map(l => html`<span class="label" key=${l}>${l}</span>`)}
                    </div>
                </div>
            `;
        }

        function App() {
            const [pubkey, setPubkey] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [profile, setProfile] = useState(null);
            const [recent, setRecent] = useState([]);

            const searchProfile = useCallback(async (pk) => {
                const key = (pk || pubkey).trim();
                if (!key) return;
                setLoading(true);
                setError(null);
                setProfile(null);
                try {
                    // Check if it looks like a pubkey (hex or npub) vs a search query
                    const isPubkey = /^[0-9a-f]{64}$/i.test(key) || key.startsWith('npub1');
                    if (isPubkey) {
                        const res = await fetch('/api/profile/' + encodeURIComponent(key));
                        if (res.status === 404) { setError('Profile not found'); return; }
                        if (!res.ok) { setError(await res.text() || 'Failed to fetch'); return; }
                        setProfile(await res.json());
                    } else {
                        // Search by label/bio text
                        const res = await fetch('/api/search?q=' + encodeURIComponent(key));
                        if (!res.ok) { setError(await res.text() || 'Search failed'); return; }
                        const results = await res.json();
                        setRecent(results);
                        if (results.length === 0) { setError('No results found'); return; }
                        // Show first result as profile
                        const first = results[0];
                        const profileRes = await fetch('/api/profile/' + encodeURIComponent(first.pubkey));
                        if (profileRes.ok) {
                            setProfile(await profileRes.json());
                        }
                        // Also update recent with search results
                        setRecent(results);
                    }
                    if (pk) setPubkey(pk);
                } catch { setError('Failed to connect to server'); }
                finally { setLoading(false); }
            }, [pubkey]);

            useEffect(() => {
                fetch('/api/recent?limit=20')
                    .then(r => r.json())
                    .then(setRecent)
                    .catch(() => {});
            }, []);

            useEffect(() => {
                if (profile) {
                    setRecent(prev => {
                        const idx = prev.findIndex(r => r.pubkey === profile.pubkey);
                        if (idx === -1) return prev;
                        const updated = [...prev];
                        updated[idx] = { ...updated[idx], name: profile.name, picture: profile.picture };
                        return updated;
                    });
                }
            }, [profile]);

            return html`
                <div class="app">
                    <h1>Nostr Profile Classifier</h1>

                    <div class="search-box">
                        <input type="text"
                            value=${pubkey}
                            onInput=${(e) => setPubkey(e.target.value)}
                            onKeyPress=${(e) => e.key === 'Enter' && searchProfile()}
                            placeholder="Enter pubkey (hex/npub) or search labels..."
                            disabled=${loading} />
                        <button onClick=${() => searchProfile()} disabled=${loading}>
                            ${loading ? 'Loading...' : 'Search'}
                        </button>
                    </div>

                    ${error && html`<div class="error">${error}</div>`}
                    ${profile && html`<${ProfileCard} profile=${profile} onSearch=${searchProfile} />`}

                    <h2>Recent Classifications</h2>
                    <div>
                        ${recent.length === 0 && html`<div class="loading">No classifications yet</div>`}
                        ${recent.map(item => html`<${RecentItem} key=${item.pubkey} item=${item} onSearch=${searchProfile} />`)}
                    </div>
                </div>
            `;
        }

        render(html`<${App} />`, document.getElementById('app'));
    </script>
</body>
</html>
